services:
  - type: web
    name: studymate-ai-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PYTHONIOENCODING
        value: utf-8
      - key: OPENAI_API_KEY
        sync: false   # set in Render dashboard (optional)
    plan: free
    healthCheckPath: /api/health
